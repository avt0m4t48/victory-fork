name: Reproduce plain-copy cache fault attribution
on:
  push:
    branches: [verify/plaincopy-fault-block-baseline]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      VICTORY_COPY_PLAIN: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Confirm baseline and probe
        shell: pwsh
        run: |
          if ((git rev-parse HEAD~2) -ne '0b0074e0b2765e574c622e9a3de566f20f04135b') { throw 'Unexpected source revision' }
          if ((git diff --name-only HEAD~2 HEAD~1) -ne 'crates/victory-gpu/src/plaincopy.rs') { throw 'Unexpected candidate changes' }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test copy across a reserved interior block
        shell: pwsh
        run: |
          $output = & cargo test --locked -p victory-gpu --features diagnostics --lib a_hole_between_readable_blocks_does_not_mark_the_ends -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $log = $output -join ' '
          if ($code -ne 101 -or $log -notmatch 'panicked at' -or $log -notmatch 'an unrelated read of the first committed block must still use the fast path') {
            throw 'The baseline did not fail at the healthy-block assertion'
          }
          Write-Output 'Confirmed the expected baseline failure'
          exit 0
