name: Direct compute group count on Windows WARP
on:
  push:
    branches: [verify/integrated-dispatch-2e02245]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      VICTORY_D3D12_WARP: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Apply only the test fixture to the exact source commit
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP direct-compute-fixture.patch
          git diff --binary --output="$fixture" 2e02245 HEAD -- crates
          if ($LASTEXITCODE) { throw 'Fixture export failed' }
          git checkout --detach 2e02245
          if ($LASTEXITCODE -or (git rev-parse --short=7 HEAD) -ne '2e02245') { throw 'Wrong source commit' }
          git apply --check "$fixture"
          if ($LASTEXITCODE) { throw 'Fixture does not apply' }
          git apply "$fixture"
          if ($LASTEXITCODE) { throw 'Fixture apply failed' }
          git status --short
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Split enabled
        env:
          VICTORY_GROUP_SPLIT: '1'
          EXPECTED_DIRECT_GROUPS: '65537'
        run: cargo test --locked -p victory-gpu --features diagnostics --lib pipeline::tests::warp_direct_compute_group_count_without_group_x -- --exact --nocapture
      - name: Split disabled control
        env:
          VICTORY_GROUP_SPLIT: '0'
          EXPECTED_DIRECT_GROUPS: '65535'
        run: cargo test --locked -p victory-gpu --features diagnostics --lib pipeline::tests::warp_direct_compute_group_count_without_group_x -- --exact --nocapture
      - name: Group X and local X through translated DXIL
        env:
          VICTORY_GROUP_SPLIT: '1'
        run: cargo test --locked -p victory-shader --lib emit::valu_tests::group_base_rebases_group_x_without_shifting_local_x -- --exact --nocapture
      - name: Shader metadata
        run: cargo test --locked -p victory-shader --lib a_program_that_reads_its_group_id_gets_the_group_base -- --nocapture
