name: Paired Wave64 workgroup layout readback
on:
  push:
    branches: [verify/pr-854-paired-wave-layout]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 14
    env:
      VICTORY_WARP: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Confirm the exact branch and test-only addition
        shell: pwsh
        run: |
          if ((git rev-parse HEAD~2) -ne '0751197e744c92d392a65d02fe40973f566843e2') { throw 'Unexpected PR source' }
          if ((git diff --name-only HEAD~2 HEAD~1) -ne 'crates/victory-shader/src/emit/wave64_tests.rs') { throw 'Unexpected source changes' }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run the 64-lane and 128-lane groups on WARP
        run: cargo test --locked -p victory-shader --lib paired_wave_readback_preserves_three_dimensional_thread_ids -- --nocapture --test-threads=1
