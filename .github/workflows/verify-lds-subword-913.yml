name: LDS subword write regression on WARP
on:
  push:
    branches: [verify/lds-subword-warp-913]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      VICTORY_WARP: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Confirm the patch and test revisions
        shell: pwsh
        run: |
          if ((git rev-parse HEAD^) -ne '51a20b5ffd931d918dd1ffa9b1d1ced0ceb2e01a') { throw 'Unexpected test revision' }
          if ((git rev-parse HEAD^^) -ne '5cf45f7a32267a4c435f853c3ef3d55e63ae0717') { throw 'Unexpected PR revision' }
          if ((git diff --name-only HEAD^ HEAD) -ne '.github/workflows/verify-lds-subword-913.yml') { throw 'Unexpected source changes' }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check all four LDS writes with the fix
        shell: pwsh
        run: |
          $test = 'emit::valu_tests::ds_subword_writes_preserve_neighboring_bits_and_one_lanes_value'
          $output = & cargo test --locked -p victory-shader --lib $test -- --exact --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $log = Join-String -InputObject $output -Separator ' '
          if ($code -ne 0 -or $log -notmatch '1 passed; 0 failed; 0 ignored' -or $log -match 'device; skipped') {
            throw 'The test did not run successfully on WARP'
          }
      - name: Test the same shader with the original lowering
        shell: pwsh
        run: |
          git restore --source=a25370661ed1343e2f2d5e79669ec8db4e60dc68 -- crates/victory-shader/src/emit/lower.rs
          if ($LASTEXITCODE) { throw 'Unable to restore the original lowering' }
          $test = 'emit::valu_tests::ds_subword_writes_preserve_neighboring_bits_and_one_lanes_value'
          $output = & cargo test --locked -p victory-shader --lib $test -- --exact --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -eq 101 -and (Join-String -InputObject $output -Separator ' ') -match 'overlapping LDS writes merged values') {
            Write-Output 'The original lowering returned a value that no lane supplied'
            exit 0
          }
          throw 'The original lowering did not fail the expected overlapping-field assertion'
