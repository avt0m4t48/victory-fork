name: Constant floating compares on WARP
on:
  push:
    branches: [verify/warp-constant-float-compares]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      VICTORY_WARP: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check the unfixed WARP failure
        shell: pwsh
        run: |
          $output = & cargo test --locked -p victory-shader float_compares_that_are_always_false_or_true -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -eq 0 -or ($output -join "`n") -notmatch 'dispatch failed.*(suspend|removed|hung|0x887A000[567])') {
            throw 'The unpatched shader did not reproduce WARP device loss'
          }
