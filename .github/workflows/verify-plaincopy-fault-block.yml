name: Plain-copy fault attribution
on:
  push:
    branches: [verify/plaincopy-fault-block]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Confirm the source
        shell: pwsh
        env:
          TESTED_REVISION: a0869564130e980bd464c6d7cf3bcf4511551d02
        run: |
          if ((git rev-parse HEAD^) -ne $env:TESTED_REVISION) { throw 'Unexpected source revision' }
          if ((git diff --name-only HEAD^ HEAD) -ne '.github/workflows/verify-plaincopy-fault-block.yml') { throw 'Unexpected source changes' }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test plain-copy success, partial faults, and the cache
        shell: pwsh
        run: |
          $output = & cargo test --locked -p victory-gpu --features diagnostics --lib plaincopy::tests -- --test-threads=1 --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $log = $output -join ' '
          if ($code -ne 0 -or $log -notmatch '5 passed; 0 failed; 0 ignored' -or $log -notmatch 'a_hole_between_readable_blocks_does_not_mark_the_ends.* ok') {
            throw 'The plain-copy tests did not pass'
          }
