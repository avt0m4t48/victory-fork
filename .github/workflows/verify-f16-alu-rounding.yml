name: Packed and mixed f16 ALU rounding on WARP
on:
  push:
    branches: [verify/f16-alu-rounding]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      VICTORY_WARP: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Read back nearest-even packed and mixed ALU results
        shell: pwsh
        run: |
          cargo test --locked -p victory-shader packed_and_mixed_f16_alu_use_requested_rounding -- --nocapture
      - name: Check the original lowering ignores requested rounding
        shell: pwsh
        run: |
          git restore --source=4e17478 -- crates/victory-shader/src/emit/lower.rs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $output = & cargo test --locked -p victory-shader packed_and_mixed_f16_alu_use_requested_rounding -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -eq 0 -or ($output -join "`n") -notmatch 'v_pk_add_f16 ignored rounding mode') {
            throw 'The original lowering failed to reproduce the ignored rounding mode'
          }
          exit 0
