name: Copy queue fence handling on WARP removal
on:
  push:
    branches: [verify/copy-queue-removed-fence-r2]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Confirm the source
        shell: pwsh
        env:
          TESTED_REVISION: 8654c67aa0e361e293c92e6466fe0a5c2d354007
        run: |
          if ((git rev-parse HEAD^) -ne $env:TESTED_REVISION) { throw 'Unexpected source revision' }
          if ((git diff --name-only HEAD^ HEAD) -ne '.github/workflows/verify-copy-queue-removed-fence.yml') { throw 'Unexpected source changes' }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test copy queue behavior on WARP
        shell: pwsh
        run: |
          $output = & cargo test --locked -p victory-gpu --features diagnostics --lib queue2::tests -- --test-threads=1 --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $log = $output -join ' '
          if ($code -ne 0 -or $log -notmatch 'WARP reported device removal for the pending copy job') {
            throw 'The copy queue tests or explicit removal probe did not pass'
          }
