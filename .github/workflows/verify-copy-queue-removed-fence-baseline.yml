name: Reproduce copy fence completion on WARP removal
on:
  push:
    branches: [verify/copy-queue-removed-fence-baseline]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Confirm baseline and test
        shell: pwsh
        run: |
          if ((git rev-parse HEAD~2) -ne '0b0074e0b2765e574c622e9a3de566f20f04135b') { throw 'Unexpected source revision' }
          if ((git diff --name-only HEAD~2 HEAD~1) -ne 'crates/victory-gpu/src/queue2.rs') { throw 'Unexpected test changes' }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Remove a WARP device with a pending copy
        shell: pwsh
        run: |
          $output = & cargo test --locked -p victory-gpu --features diagnostics --lib device_removal_does_not_complete_a_copy_job -- --test-threads=1 --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $log = $output -join ' '
          if ($code -ne 101 -or $log -notmatch 'panicked at' -or $log -notmatch 'a removed copy fence must not report completion') {
            throw 'The original copy queue did not fail the completion assertion'
          }
          Write-Output 'Confirmed the original copy wait accepted device removal as completion'
          exit 0
