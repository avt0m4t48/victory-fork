name: Check synchronous and late direct-fence failure handling on WARP
on:
  push:
    branches: [verify/late-direct-fence-errors-green]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Validate the candidate and test-only changes
        shell: pwsh
        run: |
          if ((git rev-parse HEAD~4) -ne '0b0074e0b2765e574c622e9a3de566f20f04135b') { throw 'Unexpected baseline' }
          if ((git rev-parse HEAD~2) -ne '85e2a1f1e76982dd77b3a1019243ac14084bbd4e') { throw 'Unexpected production source' }
          if ((git diff --name-only HEAD~2 HEAD~1) -ne 'crates/victory-gpu/src/host.rs') { throw 'Unexpected test changes' }
      - name: Verify the direct path and the late-flight write
        shell: pwsh
        run: |
          cargo test --locked -p victory-gpu --features diagnostics --lib host::direct_fence_probe::synchronous_submit_checks_fence_waits_before_publishing_completion -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = 'host::late_fence_probe::waits_for_a_flight_before_its_bottom_of_pipe_write'
          foreach ($mode in @('registration','wait','healthy')) {
            $env:VICTORY_TEST_LATE_FENCE_MODE = $mode
            cargo test --locked -p victory-gpu --features diagnostics --lib $test -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check exact production source and existing queue tests
        shell: pwsh
        run: |
          git switch --detach 85e2a1f1e76982dd77b3a1019243ac14084bbd4e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked -p victory-gpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p victory-gpu --features diagnostics --lib queue2::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p xtask -- policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
