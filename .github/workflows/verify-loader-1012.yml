name: Loader 1012 Windows verification
on:
  push:
    branches: [verify/loader-1012-ve1MQqXb]
permissions:
  contents: read
jobs:
  unwind:
    name: ${{ matrix.case.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: Issue 1012 reported baseline
            sha: 39731795d2d5117e6f90939273ee130428d28137
            test: crash::tests::unwinds_like_the_system_walk
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.case.sha }}
      - name: Verify checkout and toolchain
        run: |
          git rev-parse HEAD
          rustup toolchain install
          rustc -vV
      - name: Run exact unwind test
        run: cargo test -p victory-loader --locked --lib ${{ matrix.case.test }} -- --exact --test-threads=1 --nocapture
