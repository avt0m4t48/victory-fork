name: D16 table range review
on:
  push:
    branches: [verify/pr-927-d16-table-range]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Confirm the PR source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD~2) -ne '5dc9e63f04cac3e508d8a5e9cb6edd72a23ca175') { throw 'Unexpected PR head' }
          if ((git diff --name-only HEAD~2 HEAD~1) -ne 'crates/victory-shader/src/emit/valu_tests.rs') { throw 'Unexpected candidate changes' }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Exercise the range-base control on WARP
        shell: pwsh
        run: |
          $output = & cargo test --locked -p victory-shader --lib halves_go_through_a_table_as_they_are_and_name_their_views -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 0 -or ($output -join ' ') -notmatch '1 passed; 0 failed') { throw 'The control did not pass' }
      - name: Exercise a descriptor inside the range
        shell: pwsh
        run: |
          $output = & cargo test --locked -p victory-shader --lib d16_load_names_the_descriptor_used_inside_a_table_range -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $log = $output -join ' '
          if ($code -ne 101 -or $log -notmatch 'left:.*\[\(1, 0\), \(1, 16\)\]' -or $log -notmatch 'right:.*\[\(1, 8\), \(1, 16\)\]') {
            throw 'The interior-descriptor regression did not fail at the expected metadata assertion'
          }
          Write-Output "Confirmed the range's first descriptor is reported instead of the one accessed"
          exit 0
