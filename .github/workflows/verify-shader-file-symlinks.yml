name: Shader scans accept linked files on Windows
on:
  push:
    branches: [verify/shader-file-symlinks-green]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Confirm exact patch
        shell: pwsh
        run: |
          if ((git rev-parse HEAD^) -ne 'c663c0664f13276eae7cc6288cfe7cd80ade758d') { throw 'Unexpected source revision' }
          if ((git diff --name-only HEAD^ HEAD) -ne '.github/workflows/verify-shader-file-symlinks.yml') { throw 'Unexpected source changes' }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check the normal binary commands
        shell: pwsh
        run: |
          $output = & cargo test --locked -p victory --test shader_file_symlinks -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $log = $output | Out-String
          if ($code -ne 0 -or $log -match 'skipping symlink checks' -or $log -notmatch 'test result: ok. 1 passed') {
            throw "The Windows symlink regression did not pass, code $code"
          }
      - run: cargo run --locked --quiet --package xtask -- policy
