name: Shader scans through file symlinks
on:
  push:
    branches: [verify/shader-file-symlinks-red]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Confirm the unmodified scanner
        shell: pwsh
        run: |
          if ((git rev-parse HEAD~2) -ne '0b0074e0b2765e574c622e9a3de566f20f04135b') { throw 'Unexpected baseline' }
          git diff --exit-code HEAD~2 HEAD -- apps/victory/src
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Confirm a file symlink returns zero containers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & cargo test --locked -p victory --test shader_file_symlinks -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $log = $output | Out-String
          if ($code -ne 101 -or $log -notmatch 'panicked at' -or $log -notmatch 'shaders\.rpf' -or $log -notmatch 'containers\s+0 \(0 duplicates skipped\)') {
            throw "Expected the original scanner to find zero containers in the linked file, code $code"
          }
          Write-Output 'Confirmed linked files were skipped by the original scanner'
