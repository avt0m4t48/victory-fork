name: Early pipeline cache without an application library
on:
  push:
    branches: [verify/pr-938-early-pipeline-cache]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Confirm the PR source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD~2) -ne '9e7cb4c29cfa7587f8199dc388cbbcbb83c77e2b') { throw 'Unexpected PR head' }
          if ((git diff --name-only HEAD~2 HEAD~1) -ne 'crates/victory-gpu/src/pipeline/library.rs') { throw 'Unexpected probe changes' }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Save and reload the early list in separate processes
        shell: pwsh
        run: |
          $env:VICTORY_TEST_EARLY_DIR = Join-Path $env:RUNNER_TEMP ('victory-early-keys-' + [guid]::NewGuid().ToString())
          $test = 'early_keys_persist_across_processes_without_an_application_library'
          foreach ($phase in 'write', 'read') {
            $env:VICTORY_TEST_LIBRARY_ABSENT = $phase
            $output = & cargo test --locked -p victory-gpu --features diagnostics --lib $test -- --test-threads=1 --nocapture 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Output $_ }
            $log = $output -join ' '
            $mark = if ($phase -eq 'write') { 'persisted all six early keys without an application library' } else { 'fresh process reloaded all six early keys' }
            if ($code -ne 0 -or $log -notmatch '1 passed; 0 failed; 0 ignored' -or $log -notmatch $mark) {
              throw "The $phase phase did not execute and pass"
            }
          }
