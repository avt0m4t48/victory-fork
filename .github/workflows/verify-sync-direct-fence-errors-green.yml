name: Check synchronous direct-fence failure and normal completion on WARP
on:
  push:
    branches: [verify/sync-direct-fence-errors-green]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Validate the tested source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD~3) -ne '0b0074e0b2765e574c622e9a3de566f20f04135b') { throw 'Unexpected baseline' }
          if ((git rev-parse HEAD~2) -ne 'cf9904bb75a331f66cee9707f2d71de79f912c28') { throw 'Unexpected candidate' }
          if ((git diff --name-only HEAD~2 HEAD~1) -ne 'crates/victory-gpu/src/host.rs') { throw 'Unexpected test changes' }
      - name: Inject failures and check ordinary and timed submissions
        shell: pwsh
        run: |
          cargo test --locked -p victory-gpu --features diagnostics --lib host::direct_fence_probe::synchronous_submit_checks_fence_waits_before_publishing_completion -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check exact production source and existing queue tests
        shell: pwsh
        run: |
          git switch --detach cf9904bb75a331f66cee9707f2d71de79f912c28
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked -p victory-gpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p victory-gpu --features diagnostics --lib queue2::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p xtask -- verify-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
