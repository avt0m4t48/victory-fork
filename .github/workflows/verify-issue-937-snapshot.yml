name: Observe a later title-memory mapping from a closed WARP list
on:
  push:
    branches: ["verify/issue-937-snapshot-*"]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      VICTORY_D3D12_WARP: '1'
      VICTORY_LATE_WAIT: '0'
      VICTORY_INPLACE: '0'
      VICTORY_GPU_TIMING: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Read the two directory words through actual D3D12 submissions
        shell: pwsh
        run: |
          Remove-Item Env:VICTORY_GPU_TIMING -ErrorAction SilentlyContinue
          cargo test --locked -p victory-gpu --features diagnostics --lib memory::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
