name: Dispatch-piece group ID and local ID regression
on:
  push:
    branches: [verify/pr-976-dispatch-base-red]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 14
    env:
      VICTORY_GROUP_SPLIT: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Confirm exact PR source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD~2) -ne '23affc709f4369330addd425afa64a71ebb24dab') { throw 'Unexpected PR source' }
          if ((git diff --name-only HEAD~2 HEAD~1) -ne 'crates/victory-shader/src/emit/valu_tests.rs') { throw 'Unexpected source changes' }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Read the first dispatch piece and a piece with base 65535
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $output = & cargo test --locked -p victory-shader --lib group_base_rebases_group_x_without_shifting_local_x -- --test-threads=1 --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $log = $output | Out-String
          if ($code -ne 101 -or $log -notmatch 'group base must leave the local ID alone' -or $log -notmatch 'left:\s+\[65535, 65535\]' -or $log -notmatch 'right:\s+\[0, 65535\]') {
            throw "Expected only the local X ID to be wrong, code $code"
          }
          Write-Output 'Confirmed a dispatch-piece base offsets both group and local IDs'
          exit 0
