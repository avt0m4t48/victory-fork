name: Reproduce empty grouped submission without a fence
on:
  push:
    branches: [verify/cardmeter-empty-group-red]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      VICTORY_D3D12_WARP: '1'
      VICTORY_CARD_METER: '1'
      VICTORY_GPU_TIMING: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Confirm production code still matches the first patch
        shell: pwsh
        run: |
          if ((git rev-parse HEAD~2) -ne '8f16b0f97dd6cb24dd26b9518d498b1a12d5f8e8') { throw 'Unexpected source revision' }
          git diff --exit-code HEAD~2 HEAD -- crates/victory-gpu/src/host.rs
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Look for the missing direct-queue fence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & cargo test --locked -p victory-gpu --features diagnostics --lib a_grouped_empty_submission_signals_the_direct_queue -- --test-threads=1 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $log = $output | Out-String
          if ($code -ne 101 -or $log -notmatch 'panicked at' -or $log -notmatch 'an empty timed submission needs a new completion signal') { throw "Expected the missing completion signal, code $code" }
          Write-Output 'Confirmed that the grouped empty submission did not signal the direct queue'
          exit 0
