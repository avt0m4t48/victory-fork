name: Pipeline library restart ordering
on:
  push:
    branches: [verify/pipeline-cache-restart-order]
permissions:
  contents: read
jobs:
  filesystem:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Check mapped and buffered library saves
        shell: pwsh
        run: |
          foreach ($mode in ('1', '0')) {
            $env:VICTORY_LIBRARY_MAP = $mode
            $output = & cargo test --locked -p victory-gpu restart_reads_the_latest_save -- --nocapture 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Output $_ }
            if ($code -ne 0 -or ($output -join "`n") -notmatch '2 passed; 0 failed') {
              throw "The expected two restart tests did not both pass with VICTORY_LIBRARY_MAP=$mode"
            }
          }
