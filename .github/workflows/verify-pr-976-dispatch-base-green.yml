name: Group base changes group IDs only on Windows WARP
on:
  push:
    branches: [verify/pr-976-dispatch-base-green]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      VICTORY_GROUP_SPLIT: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Confirm the original PR and candidate
        shell: pwsh
        run: |
          if ((git rev-parse HEAD~3) -ne '23affc709f4369330addd425afa64a71ebb24dab') { throw 'Unexpected PR source' }
          if ((git rev-parse HEAD^) -ne '1ae3e333b686547137dc7320b267e7093d886f3d') { throw 'Unexpected source revision' }
          if ((git diff --name-only HEAD^ HEAD) -ne '.github/workflows/verify-pr-976-dispatch-base-green.yml') { throw 'Unexpected source changes' }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Read both IDs on WARP and exercise the complete shader suite
        run: cargo test --locked -p victory-shader --lib -- --test-threads=1
      - run: cargo run --locked --quiet --package xtask -- policy
