name: Reproduce missed embedded DXBC hashes on Windows
on:
  push:
    branches: [verify/embedded-shader-spans-red]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Confirm unchanged scanner and parser
        shell: pwsh
        run: |
          if ((git rev-parse HEAD~2) -ne '0b0074e0b2765e574c622e9a3de566f20f04135b') { throw 'Unexpected baseline' }
          git diff --exit-code HEAD~2 HEAD -- apps/victory/src crates/victory-shader
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Reproduce a known embedded hash reported as missing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & cargo test --locked -p victory --test embedded_shader -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          $log = $output | Out-String
          if ($code -ne 101 -or $log -notmatch 'panicked at' -or $log -notmatch '1 hashes asked, 0 found') { throw "Expected an embedded shader to be missed, code $code" }
          Write-Output 'Confirmed the original warm-up missed the exact embedded DXBC hash'
          exit 0
